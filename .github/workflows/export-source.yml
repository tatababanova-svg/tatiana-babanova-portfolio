name: Export source bundle

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-source
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          retention-days: 1
